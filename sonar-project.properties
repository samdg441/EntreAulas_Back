sonar.projectKey=EntreAulas-Back_Refactor
sonar.projectName=EntreAulas-Back_Refactor
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/scripts/**

# Vitest genera este archivo con npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Cuentan: services, controllers, repos, middleware, utils y rutas con lógica
# (auth, password-reset, ai, qr-evaluaciones).
# No cuentan: arranque HTTP, reexports, rutas ya delgadas, tests, scripts, docs.
sonar.coverage.exclusions=src/test/**,**/*.test.ts,src/scripts/**,src/docs/**,**/*.d.ts,src/routes/**,src/app.ts,src/server.ts,src/modules/teachers.router.ts,src/modules/academic/**/*.routes.ts,src/modules/analytics/**/*.routes.ts,src/modules/evaluations/evaluations.routes.ts,src/modules/evaluations/student-evaluations.routes.ts,src/modules/evaluations/resultados.routes.ts
