sonar.projectKey=EntreAulas_Back
# Debe coincidir EXACTO con el proyecto en SonarQube (el token sqp_ solo sirve para ese proyecto).
sonar.projectName=EntreAulas_Back
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src/test

# Solo RQ6, RQ14–RQ17 y RQ27 (bugs, smells y coverage).
# RQ6  → src/middleware/auth.ts
# RQ14 → src/modules/evaluations/qr-evaluaciones.routes.ts (auto-enroll)
# RQ15 → qr-evaluaciones.routes.ts + qr-batch.ts (batch QR)
# RQ16 → src/modules/evaluations/qr-evaluaciones.routes.ts (share-email)
# RQ17 → src/modules/evaluations/qr-resolucion.ts
# RQ27 / RF-ACA-27 → src/modules/academic/estudiante-materias.ts
sonar.inclusions=src/middleware/auth.ts,src/modules/evaluations/qr-evaluaciones.routes.ts,src/modules/evaluations/qr-batch.ts,src/modules/evaluations/qr-resolucion.ts,src/modules/academic/estudiante-materias.ts
sonar.test.inclusions=src/test/unit/rq6-rbac.test.ts,src/test/unit/rq14-auto-inscripcion.test.ts,src/test/unit/rq15-generar-qr.test.ts,src/test/unit/rq16-correo-qr.test.ts,src/test/unit/rq17-resolucion-token.test.ts,src/test/unit/rq27-relacion-estudiante-materia.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/scripts/**

# Vitest genera este archivo con npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage de dominio que sí pegan las unitarias (no handlers HTTP).
sonar.coverage.exclusions=src/test/**,**/*.test.ts,**/*.d.ts,**/*.routes.ts
