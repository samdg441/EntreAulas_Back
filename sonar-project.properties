sonar.projectKey=EntreAulas-Back_Refactor
sonar.projectName=EntreAulas-Back_Refactor
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/scripts/**

# Vitest genera este archivo con npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage de RQ6 y RQ14–RQ17: solo lógica de dominio que sí pegan las unitarias.
# RQ6  → src/middleware/auth.ts
# RQ17 → src/modules/evaluations/qr-resolucion.ts
# RQ14–RQ16 no tienen helper de producción: viven en qr-evaluaciones.routes.ts (handler).
sonar.coverage.inclusions=src/middleware/auth.ts,src/modules/evaluations/qr-resolucion.ts

# Fuera de coverage (siguen analizándose bugs/smells):
# - tests y scripts
# - RQ14 batch / RQ15 generar / RQ16 correo / RQ14 auto-enroll → qr-evaluaciones.routes.ts
# - resto de HTTP, bootstrap y módulos que no son estos requisitos
sonar.coverage.exclusions=src/test/**,**/*.test.ts,src/scripts/**,src/docs/**,**/*.d.ts,**/*.routes.ts,src/routes/**,src/app.ts,src/server.ts,src/modules/analytics/**,src/modules/ai-summary/**,src/modules/academic/**,src/modules/auth/**,src/modules/evaluations/evaluations.*,src/modules/evaluations/student-evaluations.routes.ts,src/modules/evaluations/resultados.routes.ts,src/modules/evaluations/evaluations.controller.ts,src/modules/evaluations/evaluations.repository.ts,src/modules/evaluations/evaluations.service.ts,src/modules/evaluations/evaluations.types.ts,src/modules/evaluations/qr-evaluaciones.routes.ts,src/config/**,src/shared/**,src/services/**
