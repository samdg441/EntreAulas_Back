sonar.projectKey=EntreAulas_Back
sonar.projectName=EntreAulas_Back
sonar.sourceEncoding=UTF-8

# En Jenkins, withSonarQubeEnv('SonarQube') inyecta la URL real (http://sonarqube:9000).
# Este valor solo se usa al correr el scanner a mano desde tu PC.
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mismo alcance que coverage.include de vitest.config.mts.
sonar.inclusions=src/middleware/auth.ts,src/utils/passwordSecurity.ts,src/shared/errors.ts,src/shared/logger.ts,src/modules/auth/**/*.ts,src/modules/academic/users.controller.ts,src/modules/academic/estudiante-materias.ts,src/modules/analytics/calificaciones.ts,src/modules/analytics/coordinador-resumen.ts,src/modules/analytics/reporte-exportacion.ts,src/modules/analytics/teachers-analytics.service.ts,src/modules/analytics/teachers-analytics.routes.ts,src/modules/ai-summary/ai.service.ts,src/modules/ai-summary/ai.routes.ts,src/modules/evaluations/qr-resolucion.ts,src/modules/evaluations/qr-batch.ts,src/modules/evaluations/qr-auto-enroll.ts,src/modules/evaluations/qr-share-email.ts,src/modules/evaluations/qr-evaluaciones.routes.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/test/**,**/*.test.ts,src/scripts/**,src/docs/**,**/*.d.ts,src/modules/**/*.types.ts

sonar.coverage.exclusions=src/test/**,**/*.test.ts,src/scripts/**,src/docs/**,**/*.d.ts,src/modules/**/*.types.ts,src/app.ts,src/server.ts,src/routes/**,src/modules/teachers.router.ts,src/modules/academic/**/*.routes.ts,src/modules/analytics/coordinador.routes.ts,src/modules/evaluations/evaluations.routes.ts,src/modules/evaluations/student-evaluations.routes.ts,src/modules/evaluations/resultados.routes.ts,src/modules/auth/auth.dto.ts,src/modules/auth/role.repository.ts,src/modules/auth/role.types.ts
